version: '3'

services:
  registry:
    image: gricad-registry.univ-grenoble-alpes.fr/nzalikoy/scaler-task/teastore-registry:dev
    expose:
      - "8080"
    networks:
      - teastore-network

  db:
    image: gricad-registry.univ-grenoble-alpes.fr/nzalikoy/scaler-task/teastore-db:dev
    expose:
      - "3306"
    ports:
      - "3307:3306"
    networks:
      - teastore-network

  persistence:
    image: gricad-registry.univ-grenoble-alpes.fr/nzalikoy/scaler-task/teastore-persistence:dev
    expose:
      - "8080"
    environment:
      HOST_NAME: "persistence"
      REGISTRY_HOST: "registry"
      DB_HOST: "db"
      DB_PORT: "3306"
      JAEGER_AGENT_HOST: "jaeger"
      JAEGER_AGENT_PORT: "6831"
    networks:
      - teastore-network

  auth:
    image: gricad-registry.univ-grenoble-alpes.fr/nzalikoy/scaler-task/teastore-auth:dev
    expose:
      - "8080"
    environment:
      HOST_NAME: "auth"
      REGISTRY_HOST: "registry"
      JAEGER_AGENT_HOST: "jaeger"
      JAEGER_AGENT_PORT: "6831"
    networks:
      - teastore-network

  image:
    image: gricad-registry.univ-grenoble-alpes.fr/nzalikoy/scaler-task/teastore-image:dev
    expose:
      - "8080"
    environment:
      HOST_NAME: "image"
      REGISTRY_HOST: "registry"
      JAEGER_AGENT_HOST: "jaeger"
      JAEGER_AGENT_PORT: "6831"
    networks:
      - teastore-network

  recommender:
    image: gricad-registry.univ-grenoble-alpes.fr/nzalikoy/scaler-task/teastore-recommender:dev
    expose:
      - "8080"
    environment:
      HOST_NAME: "recommender"
      REGISTRY_HOST: "registry"
      JAEGER_AGENT_HOST: "jaeger"
      JAEGER_AGENT_PORT: "6831"
    networks:
      - teastore-network

  webui:
    image: gricad-registry.univ-grenoble-alpes.fr/nzalikoy/scaler-task/teastore-webui:dev
    expose:
      - "8080"
    environment:
      HOST_NAME: "webui"
      REGISTRY_HOST: "registry"
      JAEGER_AGENT_HOST: "jaeger"
      JAEGER_AGENT_PORT: "6831"
    ports:
      - "8080:8080"
    networks:
      - teastore-network

  jaeger:
    image: jaegertracing/all-in-one:1.22
    ports:
      - "5775:5775/udp"  # Agent Thrift compact
      - "6831:6831/udp"  # Agent Jaeger
      - "6832:6832/udp"  # Agent Jaeger
      - "5778:5778"      # Configuration HTTP endpoint
      - "16686:16686"    # Jaeger UI
      - "14268:14268"    # Collector HTTP endpoint
      - "14250:14250"    # Collector Thrift compact
      - "9411:9411"      # Zipkin HTTP endpoint (optional)
    networks:
      - teastore-network

networks:
  teastore-network:
    driver: bridge
